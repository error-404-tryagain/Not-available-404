<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Love 💖</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💖</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            max-width: 500px;
            width: 90%;
            transition: all 0.5s ease;
        }

        .password-section {
            display: block;
        }

        .content-section {
            display: none;
        }

        .password-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 3px solid #ddd;
            border-radius: 50px;
            text-align: center;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .password-input:focus {
            outline: none;
            border-color: #ff69b4;
            box-shadow: 0 0 20px rgba(255, 105, 180, 0.3);
        }

        .unlock-btn {
            background: linear-gradient(45deg, #ff69b4, #ff1493);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .unlock-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 105, 180, 0.4);
        }

        .love-message {
            font-size: 28px;
            font-weight: bold;
            margin: 30px 0;
            background: linear-gradient(45deg, #ff69b4, #ff1493, #ffc0cb);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: glow 2s ease-in-out infinite alternate;
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 5px #ff69b4); }
            to { filter: drop-shadow(0 0 20px #ff1493); }
        }

        .days-counter {
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
            padding: 25px;
            border-radius: 20px;
            margin: 20px 0;
            box-shadow: 0 10px 30px rgba(255, 105, 180, 0.3);
        }

        .days-counter h3 {
            color: #ff1493;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .days-number {
            font-size: 48px;
            font-weight: bold;
            color: #ff1493;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .full-counter {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 25px;
            border-radius: 20px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(255, 192, 203, 0.3);
        }

        .full-counter h3 {
            color: #ff69b4;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .time-display {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
        }

        .time-unit {
            background: rgba(255, 105, 180, 0.2);
            padding: 15px 10px;
            border-radius: 15px;
            min-width: 70px;
            backdrop-filter: blur(5px);
        }

        .time-value {
            font-size: 24px;
            font-weight: bold;
            color: #ff1493;
        }

        .time-label {
            font-size: 12px;
            color: #ff69b4;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .heart {
            position: absolute;
            color: #ff69b4;
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                margin: 20px;
            }
            
            .love-message {
                font-size: 24px;
            }
            
            .days-number {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container">
        <div class="password-section" id="passwordSection">
            <h2 style="color: #666; margin-bottom: 30px;">🔒 Enter Password</h2>
            <input type="password" class="password-input" id="passwordInput" placeholder="Type your password here..." maxlength="20">
            <br>
            <button class="unlock-btn" onclick="checkPassword()">Unlock Love 💕</button>
        </div>

        <div class="content-section" id="contentSection">
            <div class="love-message">Love you till the end 💖</div>
            
            <div class="days-counter">
                <h3>Days Together</h3>
                <div class="days-number" id="daysCount">0</div>
            </div>

            <div class="full-counter">
                <h3>Exact Time Since 16/12/2022</h3>
                <div class="time-display" id="timeDisplay">
                    <!-- Counters will be populated by JavaScript -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const PASSWORD = "1922010_H"; // Password changed to 1922010_H
        const START_DATE = new Date('2022-12-15T00:00:00');
        
        let heartsInterval;

        function createHearts() {
            const heartsContainer = document.getElementById('hearts');
            for (let i = 0; i < 10; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.className = 'heart';
                    heart.innerHTML = '💖';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
                    heartsContainer.appendChild(heart);
                    
                    setTimeout(() => heart.remove(), 7000);
                }, i * 300);
            }
        }

        function checkPassword() {
            const input = document.getElementById('passwordInput').value.toLowerCase().trim();
            
            if (input === PASSWORD.toLowerCase()) {
                document.getElementById('passwordSection').style.display = 'none';
                document.getElementById('contentSection').style.display = 'block';
                createHearts();
                heartsInterval = setInterval(createHearts, 3000);
                updateCounters();
                setInterval(updateCounters, 1000);
            } else {
                document.getElementById('passwordInput').style.borderColor = '#ff4444';
                setTimeout(() => {
                    document.getElementById('passwordInput').style.borderColor = '#ddd';
                }, 500);
            }
        }

        function updateCounters() {
            const now = new Date();
            const diff = now - START_DATE;

            // Days counter
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            document.getElementById('daysCount').textContent = days;

            // Full counter
            const years = Math.floor(diff / (1000 * 60 * 60 * 24 * 365.25));
            const months = Math.floor((diff % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.44));
            const daysRemain = Math.floor((diff % (1000 * 60 * 60 * 24 * 30.44)) / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            const timeDisplay = document.getElementById('timeDisplay');
            timeDisplay.innerHTML = `
                <div class="time-unit">
                    <div class="time-value">${years}</div>
                    <div class="time-label">Years</div>
                </div>
                <div class="time-unit">
                    <div class="time-value">${months}</div>
                    <div class="time-label">Months</div>
                </div>
                <div class="time-unit">
                    <div class="time-value">${daysRemain}</div>
                    <div class="time-label">Days</div>
                </div>
                <div class="time-unit">
                    <div class="time-value">${hours.toString().padStart(2, '0')}</div>
                    <div class="time-label">Hours</div>
                </div>
                <div class="time-unit">
                    <div class="time-value">${minutes.toString().padStart(2, '0')}</div>
                    <div class="time-label">Min</div>
                </div>
                <div class="time-unit">
                    <div class="time-value">${seconds.toString().padStart(2, '0')}</div>
                    <div class="time-label">Sec</div>
                </div>
            `;
        }

        // Allow Enter key to submit password
        document.getElementById('passwordInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });
    </script>
</body>
</html>
